name: Apply Armilen branding
description: >
  Patches sources that live in upstream-tracking submodules. The submodules
  keep pointing at rustdesk/* (no second fork to maintain), so upstream syncs
  stay conflict-free; every rebrand patch of submodule code must live in this
  action, not in the workflows that call it. Patches of main-repository files
  that upstream reshuffles wholesale (src/lang/*) live here too: a direct edit
  would hit a conflict on every sync.
runs:
  using: composite
  steps:
    - name: Set APP_NAME to ArmDesk in libs/hbb_common
      shell: bash
      run: |
        set -euo pipefail
        cfg="libs/hbb_common/src/config.rs"
        if grep -qF 'RwLock::new("ArmDesk".to_owned())' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        if ! grep -qF 'APP_NAME: RwLock<String> = RwLock::new("RustDesk".to_owned())' "$cfg"; then
          echo "::error file=$cfg::APP_NAME pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        # No space in the name: a name with a space broke cmd.exe argument
        # parsing in windows.rs (reg add/rename saw "Remote" as a separate
        # token). Quoting fixed that, but dropping the space at the source is
        # simpler and more robust.
        # -i.bak + rm works with both GNU sed (Linux, Git Bash on Windows) and BSD sed (macOS)
        sed -i.bak 's/APP_NAME: RwLock<String> = RwLock::new("RustDesk"\.to_owned())/APP_NAME: RwLock<String> = RwLock::new("ArmDesk".to_owned())/' "$cfg"
        rm -f "$cfg.bak"
        grep -F 'APP_NAME: RwLock' "$cfg"

    - name: Default ID/relay server to armilen.ru in libs/hbb_common
      shell: bash
      run: |
        set -euo pipefail
        cfg="libs/hbb_common/src/config.rs"
        if grep -qF 'RENDEZVOUS_SERVERS: &[&str] = &["www.armilen.ru"]' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        if ! grep -qF 'RENDEZVOUS_SERVERS: &[&str] = &["rs-ny.rustdesk.com"]' "$cfg"; then
          echo "::error file=$cfg::RENDEZVOUS_SERVERS pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        if ! grep -qF 'RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";' "$cfg"; then
          echo "::error file=$cfg::RS_PUB_KEY pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        # Without this the client connects through the public
        # rs-ny.rustdesk.com by default (someone else's server, paid traffic
        # and someone else's point of trust), and the UI says "set up your own
        # server" although our own ID/relay (hbbs/hbbr) is already running.
        # The values are the same ones we give by hand for the official iOS
        # client.
        sed -i.bak 's/RENDEZVOUS_SERVERS: &\[&str\] = &\["rs-ny\.rustdesk\.com"\]/RENDEZVOUS_SERVERS: \&[\&str] = \&["www.armilen.ru"]/' "$cfg"
        sed -i.bak 's#RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";#RS_PUB_KEY: \&str = "GYxvuB12rp2WdQoykP0y2Whrw9sD7hpPJkTlp8LS7C0=";#' "$cfg"
        rm -f "$cfg.bak"
        grep -F 'RENDEZVOUS_SERVERS: &[&str]' "$cfg"
        grep -F 'RS_PUB_KEY: &str' "$cfg"

    - name: Point version-check URL at armilen.ru in libs/hbb_common
      shell: bash
      run: |
        set -euo pipefail
        cfg="libs/hbb_common/src/lib.rs"
        if grep -qF 'const URL: &str = "https://www.armilen.ru/api/version-check";' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        if ! grep -qF 'const URL: &str = "https://api.rustdesk.com/version/latest";' "$cfg"; then
          echo "::error file=$cfg::version-check URL pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        # Our own update check: api.rustdesk.com/version/latest is replaced
        # with our endpoint, so that custom clients learn about new builds
        # instead of staying silent or querying the official upstream.
        sed -i.bak 's#const URL: &str = "https://api.rustdesk.com/version/latest";#const URL: \&str = "https://www.armilen.ru/api/version-check";#' "$cfg"
        rm -f "$cfg.bak"
        grep -F 'const URL: &str' "$cfg"

    - name: Name RU server fields like the guide on the site in src/lang
      shell: bash
      run: |
        set -euo pipefail
        cfg="src/lang/ru.rs"
        if grep -qF '("Key", "Ключ шифрования"),' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        # The client and our setup guide must call the fields the same way,
        # otherwise the guide disagrees with what a person sees on the screen.
        # Upstream's translation calls them «Сервер ID», «Ретранслятор» and
        # «Сервер API» and does not translate the key at all.
        for old in '("ID/Relay Server", "ID/Ретранслятор"),' '("ID Server", "Сервер ID"),' '("Relay Server", "Ретранслятор"),' '("API Server", "Сервер API"),'; do
          if ! grep -qF "$old" "$cfg"; then
            echo "::error file=$cfg::$old not found, upstream changed the translation; update this action"
            exit 1
          fi
        done
        sed -i.bak 's#("ID/Relay Server", "ID/Ретранслятор")#("ID/Relay Server", "ID/Реле-сервер")#' "$cfg"
        sed -i.bak 's#("ID Server", "Сервер ID")#("ID Server", "ID-сервер")#' "$cfg"
        sed -i.bak 's#("Relay Server", "Ретранслятор")#("Relay Server", "Реле-сервер")#' "$cfg"
        sed -i.bak 's#("API Server", "Сервер API")#("API Server", "API-сервер")#' "$cfg"
        rm -f "$cfg.bak"
        # Upstream's ru.rs has no such key, so the line is added, not edited.
        # awk, not sed: BSD sed on macOS does not understand a newline in the replacement
        awk '{ print } /\("API Server", "API-сервер"\),/ { print "        (\"Key\", \"Ключ шифрования\")," }' "$cfg" > "$cfg.tmp"
        mv "$cfg.tmp" "$cfg"
        grep -F -e '("ID/Relay Server"' -e '("ID Server"' -e '("Relay Server"' -e '("API Server"' -e '("Key"' "$cfg"

    - name: Rename the personal address book to «Личные» in src/lang
      shell: bash
      run: |
        set -euo pipefail
        cfg="src/lang/ru.rs"
        if grep -qF '("My address book", "Личные"),' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        # The personal book cannot be renamed from the admin panel: the server
        # serves it on the fly (/api/ab/personal), and the client takes the
        # name from its own constant _personalAddressBookName and shows it
        # through translate(). So the translation is the only place where it
        # can be called anything else.
        #
        # «Моя адресная книга» meant the same as a book the owner creates by
        # hand, and the two could not be told apart on the screen. Books for
        # clients and branches are named after the clients, so the personal
        # one stays «Личные», and no "main" book is created at all.
        old='("My address book", "Моя адресная книга"),'
        if ! grep -qF "$old" "$cfg"; then
          echo "::error file=$cfg::$old not found, upstream changed the translation; update this action"
          exit 1
        fi
        sed -i.bak 's#("My address book", "Моя адресная книга")#("My address book", "Личные")#' "$cfg"
        rm -f "$cfg.bak"
        grep -F '("My address book"' "$cfg"

    - name: Name privacy mode implementations by what they do in src/lang
      shell: bash
      run: |
        set -euo pipefail
        cfg="src/lang/ru.rs"
        if grep -qF '("privacy_mode_impl_mag_tip", "Затемнение экрана (без драйвера)"),' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        # Upstream calls the two implementations of privacy mode «Режим 1» and
        # «Режим 2». Such names give nothing to choose by: they say neither
        # what will happen to the client's screen nor why one of them may fail
        # to start.
        #
        # In essence: mag draws a black window over the real screen through
        # the Magnification API (or WDA_EXCLUDEFROMCAPTURE), the physical
        # monitor stays on and shows black; virtual display creates a virtual
        # monitor, moves the session onto it and turns the physical ones off.
        # The first works almost everywhere with nothing installed, the second
        # needs the installed service and the virtual display driver, so the
        # name states the requirement itself: it explains why the item may be
        # missing from the menu or why it did not work.
        for old in '("privacy_mode_impl_mag_tip", "Режим 1"),' '("privacy_mode_impl_virtual_display_tip", "Режим 2"),'; do
          if ! grep -qF "$old" "$cfg"; then
            echo "::error file=$cfg::$old not found, upstream changed the translation; update this action"
            exit 1
          fi
        done
        sed -i.bak 's#("privacy_mode_impl_mag_tip", "Режим 1")#("privacy_mode_impl_mag_tip", "Затемнение экрана (без драйвера)")#' "$cfg"
        sed -i.bak 's#("privacy_mode_impl_virtual_display_tip", "Режим 2")#("privacy_mode_impl_virtual_display_tip", "Виртуальный монитор (нужен драйвер)")#' "$cfg"
        rm -f "$cfg.bak"
        grep -F -e '("privacy_mode_impl_mag_tip"' -e '("privacy_mode_impl_virtual_display_tip"' "$cfg"
