name: aislop

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality-gate:
    # Дифф синхронизации это код апстрима, а не наш: гейт на нём красный всегда.
    # У PR ветку называет head_ref. У пуша коммита слияния его нет, ветка видна
    # только в сообщении «Merge pull request #N from .../sync/upstream-X».
    if: >-
      ${{ !startsWith(github.head_ref, 'sync/upstream-')
      && !(github.event_name == 'push'
      && contains(github.event.head_commit.message, '/sync/upstream-')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ref="origin/${{ github.event.pull_request.base.ref }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            ref="${{ github.event.before }}"
          else
            ref="HEAD~1"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # 251 файлов форка не наши (апстрим RustDesk + вендорные libs/*), гейтить
      # абсолютный скор всего дерева бессмысленно - гоняем только по диффу.
      - name: Run aislop ci (changed files only)
        run: npx --yes aislop@latest ci --changes --base "${{ steps.base.outputs.ref }}"
