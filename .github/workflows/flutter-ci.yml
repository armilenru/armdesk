name: Full Flutter CI

# Armilen: a push to master no longer comes here, flutter-nightly.yml builds
# and publishes it. Keeping both triggers would mean two full four-platform
# builds for every commit, one of which publishes nothing. The PR check (the
# sync-upstream flow uses it) stays.
#
# The paths-ignore lists had also drifted apart: res/** and .github/** were
# excluded here, so edits to icons and to the workflow itself did not start
# a build.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  run-ci:
    # The called workflow declares jobs with contents: write (publishing the
    # release). With upload-artifact: false they are skipped, but GitHub
    # checks permissions before the start and refuses the whole run
    # (startup_failure) if the calling job did not grant them.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
