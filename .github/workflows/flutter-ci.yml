name: Full Flutter CI

# Armilen: push в master сюда больше не приходит - его собирает и публикует
# flutter-nightly.yml. Оставить оба триггера значило бы гонять две полные
# четырёхплатформенные сборки на каждый коммит, из которых одна ничего не
# публикует. Проверка PR (её использует поток sync-upstream) осталась.
#
# Заодно расходились paths-ignore: здесь исключены res/** и .github/**, то есть
# правки иконок и самого workflow сборку не запускали.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"

jobs:
  run-ci:
    # Вызываемый workflow объявляет джобы с contents: write (публикация
    # релиза). При upload-artifact: false они пропускаются, но GitHub сверяет
    # права до запуска и отказывает всему прогону (startup_failure), если
    # вызывающий джоб их не дал.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
