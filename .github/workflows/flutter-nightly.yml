name: Flutter Nightly Build

# Publishes builds to the rolling nightly release, which the site rollout
# takes them from.
#
# Triggered by push, not cron: a nightly run built the same thing when nothing
# had changed during the day, and once it was switched off nothing was built
# at all: commits to master reached the repository while the site kept the
# old build until someone started the workflow by hand. Building on push ties
# the contents of the nightly release to master.
#
# concurrency cancels the previous run: a series of commits in a row must not
# occupy runners with builds the next one overwrites anyway.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "res/msi/Package/License.rtf"
  # A trial build of a branch: the same path with publishing, but into a
  # separate release. The site takes files only from nightly, so it does not
  # reach the clients. A PR build cannot serve for this: its packaging steps
  # (MSI, AppImage, universal) are skipped.
  workflow_dispatch:
    inputs:
      upload-tag:
        description: Release for the build files; anything but nightly is a trial build
        type: string
        default: "nightly"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-flutter-nightly-build:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || 'nightly' }}

  # Nobody sees a failed build: the site silently stays on the previous
  # version, and with an automatic upstream release the GitHub mail goes to a
  # bot, not a person. A canceled run (pushed out by the next push) does not
  # get here.
  notify-failure:
    needs: run-flutter-nightly-build
    if: ${{ failure() && (inputs.upload-tag || 'nightly') == 'nightly' }}
    runs-on: ubuntu-latest
    steps:
      - name: Tell the ops chat
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_ADMIN_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            exit 0
          fi
          text="❌ ArmDesk: сборка ${GITHUB_SHA:0:7} упала, на сайт она не уйдёт. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" --data-urlencode text="$text" >/dev/null
