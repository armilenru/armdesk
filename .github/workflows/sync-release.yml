name: Release upstream sync

# Releases a new upstream version with no human involved: when the PR build of
# a sync/upstream-* branch has passed on every platform and the tests are
# green, the PR is merged into master and the release build starts. From
# there it goes as after an ordinary push: the v<version> release, the site,
# the client update.
#
# Only a PR with the line "auto-release: on" in its description is merged;
# scripts/sync-upstream puts it there. A merge resolved by hand is released by
# whoever did it: a green build does not say whether the conflict was
# resolved correctly.
#
# A failed build of such a PR comes here too: without a message the new
# version would silently not come out, and there would be no way to learn of it.
on:
  workflow_run:
    workflows: ["Full Flutter CI"]
    types: [completed]

jobs:
  release:
    # head_repository: a branch with this name from someone else's fork does not get through
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion) &&
      startsWith(github.event.workflow_run.head_branch, 'sync/upstream-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BASE: ${{ github.event.repository.default_branch }}
      BUILD: ${{ github.event.workflow_run.conclusion }}
      BUILD_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Merge the PR and start the release build
        id: release
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,body --jq '.[0] // empty')
          if [ -z "$pr" ] || ! jq -e '.body | test("(^|\\n)auto-release: on\\s*(\\n|$)")' <<<"$pr" >/dev/null; then
            echo "no open PR with auto-release on for $BRANCH"
            exit 0
          fi
          if [ "$BUILD" != "success" ]; then
            echo "outcome=build-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tests=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$tests" != "success" ]; then
            echo "::error::CI for $SHA is '$tests', not releasing"
            exit 1
          fi
          # --match-head-commit: exactly the commit whose build passed is merged
          gh pr merge "$(jq -r .number <<<"$pr")" --repo "$GITHUB_REPOSITORY" \
            --merge --delete-branch --match-head-commit "$SHA"
          # A push made by GITHUB_TOKEN does not start other workflows
          gh workflow run flutter-nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE"
          echo "outcome=released" >> "$GITHUB_OUTPUT"

      - name: Tell the ops chat
        if: ${{ always() && (steps.release.outputs.outcome != '' || job.status == 'failure') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_ADMIN_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          OUTCOME: ${{ steps.release.outputs.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            exit 0
          fi
          tag="${BRANCH#sync/upstream-}"
          case "$OUTCOME" in
            released) text="🚀 ArmDesk: ${tag} апстрима слит в ${BASE}, идёт сборка выпуска." ;;
            build-failed) text="❌ ArmDesk: сборка ${tag} апстрима упала, выпуск не начат. ${BUILD_URL}" ;;
            *) text="❌ ArmDesk: ${tag} апстрима собран, но не выпущен. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" ;;
          esac
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" --data-urlencode text="$text" >/dev/null
