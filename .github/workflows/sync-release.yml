name: Release upstream sync

# Выпуск новой версии апстрима без участия человека: когда сборка PR ветки
# sync/upstream-* прошла на всех платформах и тесты зелёные, PR сливается в
# master и стартует сборка выпуска. Дальше как при обычном пуше: релиз
# v<версия>, сайт, обновление клиентов.
#
# Сливается только PR со строкой «auto-release: on» в описании, её ставит
# scripts/sync-upstream. Слияние, разрешённое руками, выпускает тот, кто его
# делал: зелёная сборка не говорит, верно ли разрешён конфликт.
on:
  workflow_run:
    workflows: ["Full Flutter CI"]
    types: [completed]

jobs:
  release:
    # head_repository: ветка с таким именем из чужого форка сюда не проходит
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'sync/upstream-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - name: Merge the PR and start the release build
        id: release
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,body --jq '.[0] // empty')
          if [ -z "$pr" ] || ! jq -e '.body | test("(^|\\n)auto-release: on\\s*(\\n|$)")' <<<"$pr" >/dev/null; then
            echo "no open PR with auto-release on for $BRANCH"
            exit 0
          fi
          tests=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
            --json conclusion --jq '.[0].conclusion // "missing"')
          if [ "$tests" != "success" ]; then
            echo "::error::CI for $SHA is '$tests', not releasing"
            exit 1
          fi
          # --match-head-commit: сливается ровно тот коммит, чья сборка прошла
          gh pr merge "$(jq -r .number <<<"$pr")" --repo "$GITHUB_REPOSITORY" \
            --merge --delete-branch --match-head-commit "$SHA"
          # Пуш от GITHUB_TOKEN другие workflow не запускает
          gh workflow run flutter-nightly.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Tell the ops chat
        if: ${{ always() && (steps.release.outputs.merged == 'true' || job.status == 'failure') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_ADMIN_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$STATUS" = "success" ]; then
            text="🚀 ArmDesk: ${BRANCH#sync/upstream-} апстрима слит в ${BASE}, идёт сборка выпуска. ${run_url}"
          else
            text="❌ ArmDesk: ${BRANCH} не выпущен, сборка прошла, а выпуск нет. ${run_url}"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" --data-urlencode text="$text" >/dev/null
